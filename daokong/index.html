<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

</head>
<body>
<title>倒空</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* Layout: a phone-shaped app with a bottom icon bar; on phones the app goes edge to edge. Mist-blue palette, light + dark. */
:root {
  --bg: #E6EBF0; --surface: #F8FAFC; --sunk: #EDF1F5; --fg: #1F2733; --muted: #6A7687; --faint: #A9B3C0;
  --line: #DDE3EA; --accent: #3F5A8C; --accent-soft: #E1E8F3; --on-accent: #F8FAFC;
  --glass: rgba(255, 255, 255, .5); --hi: rgba(255, 255, 255, .28);
  --t-body: #8FB08A; --t-people: #D59A8C; --t-hand: #86A6C9; --t-home: #D9B56E; --t-mind: #A99BC9; --t-none: #C3C9D0;
  --shadow: 0 1px 2px rgba(20, 30, 50, .04), 0 18px 40px -18px rgba(20, 30, 50, .18);
  --display: "Noto Serif SC", "Songti SC", serif;
  --body: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161D; --surface: #19202A; --sunk: #222B37; --fg: #E3E9F0; --muted: #8E9AAA; --faint: #566273;
    --line: #2A3442; --accent: #9DB4E0; --accent-soft: #243149; --on-accent: #11161D;
    --glass: rgba(255, 255, 255, .04); --hi: rgba(255, 255, 255, .14);
    --t-body: #9DBB98; --t-people: #DBA698; --t-hand: #96B3D3; --t-home: #DDBE80; --t-mind: #B6A9D2; --t-none: #4A5058;
    --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 18px 40px -18px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161D; --surface: #19202A; --sunk: #222B37; --fg: #E3E9F0; --muted: #8E9AAA; --faint: #566273;
  --line: #2A3442; --accent: #9DB4E0; --accent-soft: #243149; --on-accent: #11161D;
  --glass: rgba(255, 255, 255, .04); --hi: rgba(255, 255, 255, .14);
  --t-body: #9DBB98; --t-people: #DBA698; --t-hand: #96B3D3; --t-home: #DDBE80; --t-mind: #B6A9D2; --t-none: #4A5058;
  --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 18px 40px -18px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
  -webkit-font-smoothing: antialiased;
  transition: background-color .3s;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.page { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 20; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; background: var(--fg); color: var(--surface); border-radius: 16px; padding: 8px 6px 8px 14px; display: flex; align-items: center; gap: 10px; font-size: 14px; width: max-content; max-width: min(360px, calc(100vw - 32px)); box-sizing: border-box; box-shadow: var(--shadow); transition: opacity .25s, transform .25s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast svg.i { width: 18px; height: 18px; }
.toast span { min-width: 0; overflow-wrap: anywhere; line-height: 1.45; }
.toast button { border: 0; background: transparent; color: inherit; font-size: 13px; padding: 6px 10px; border-radius: 10px; cursor: pointer; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }

/* app shell */
.app { background: var(--surface); border-radius: 30px; box-shadow: var(--shadow); overflow: clip; display: flex; flex-direction: column; min-height: 680px; }
@media (max-width: 480px) {
  body { padding-block: 12px 0; }
  .app { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); border-radius: 26px 26px 0 0; min-height: calc(100vh - 140px); }
}
.top { display: flex; align-items: center; gap: 12px; padding: 22px 20px 8px; }
.logo { width: 34px; height: 34px; border-radius: 11px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.logo svg.i { width: 19px; height: 19px; }
.top h1 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 0; letter-spacing: .1em; line-height: 1.2; }
.top .greet { font-size: 12px; color: var(--muted); display: block; letter-spacing: 0; font-family: var(--body); font-weight: 400; }
.top .spacer { flex: 1; }
.icon-btn { border: 0; background: var(--sunk); width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.icon-btn:hover { color: var(--fg); }

.view { flex: 1; padding: 12px 20px 24px; min-width: 0; }
.view-title { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin: 0 0 12px; }

/* bottom bar */
.bar { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); }
.bar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; color: var(--faint); cursor: pointer; border-radius: 14px; }
.bar button svg.i { width: 23px; height: 23px; }
.bar button[aria-selected="true"] { color: var(--accent); }
.bar button[aria-selected="true"] .pill { background: var(--accent-soft); }
.bar .pill { padding: 3px 16px; border-radius: 999px; display: grid; place-items: center; transition: background-color .2s; position: relative; }
.bar .badge { position: absolute; top: 2px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }

/* composer */
.composer { display: flex; align-items: flex-end; gap: 8px; background: var(--sunk); border-radius: 20px; padding: 6px 6px 6px 14px; }
.composer:focus-within { box-shadow: 0 0 0 1.5px var(--accent); }
.composer textarea, .composer input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: transparent; border: 0; padding: 8px 0; resize: none; }
.composer textarea { min-height: 48px; max-height: 140px; }
.composer textarea::placeholder, .composer input::placeholder { color: var(--faint); }
.composer textarea:focus-visible, .composer input:focus-visible { outline: none; }
.send { border: 0; width: 38px; height: 38px; border-radius: 13px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; cursor: pointer; flex: none; }
.send svg.i { width: 19px; height: 19px; stroke-width: 2; }
.hint { font-size: 12px; color: var(--muted); }
.sub-hint { margin: 8px 4px 0; }

/* dump list */
.notes-list { list-style: none; padding: 0; margin: 18px 0 0; display: flex; flex-direction: column; gap: 8px; }
.note { background: var(--sunk); border-radius: 18px; padding: 12px 10px 8px 14px; transition: opacity .35s, transform .35s; }
.note p { margin: 0 4px 0 0; overflow-wrap: anywhere; }
.note .meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; }
.note .when { font-size: 12px; color: var(--faint); }
.note .acts { display: flex; gap: 2px; }
.act { border: 0; background: none; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.act:hover { background: var(--surface); color: var(--accent); }
.act svg.i { width: 19px; height: 19px; }
.note.gone { opacity: 0; transform: translateX(12px); }
.older { margin-top: 16px; }
.older summary { cursor: pointer; font-size: 13px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; padding: 6px 2px; }
.older summary::-webkit-details-marker { display: none; }
.older summary svg.i { width: 16px; height: 16px; transition: transform .2s; }
.older[open] summary svg.i { transform: rotate(180deg); }
.older .note { opacity: .7; }
.empty { color: var(--muted); font-size: 14px; margin: 6px 2px 16px; display: flex; align-items: center; gap: 8px; }

/* today */
.one { background: var(--accent-soft); border-radius: 24px; padding: 22px 20px 18px; }
.one .label { font-size: 12px; color: var(--accent); letter-spacing: .1em; display: flex; align-items: center; gap: 6px; }
.one .label svg.i { width: 16px; height: 16px; }
.one .what { font-family: var(--display); font-size: 22px; font-weight: 500; margin: 10px 0 18px; overflow-wrap: anywhere; line-height: 1.45; }
.one .acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.one.done { background: var(--sunk); }
.one.done .what { color: var(--muted); }
.btn { border: 0; background: var(--accent); color: var(--on-accent); font-size: 14px; padding: 9px 16px 9px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn svg.i { width: 18px; height: 18px; stroke-width: 2; }
.btn.quiet { background: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--fg); }

/* jar */
.jar { background: var(--sunk); border-radius: 24px; padding: 16px 16px 14px; margin-bottom: 16px; }
.jar-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.jar-total { font-family: var(--display); font-size: 21px; font-weight: 500; line-height: 1.3; padding-top: 4px; font-variant-numeric: tabular-nums; }
.jar-total small { font-family: var(--body); font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.jar-full { border: 0; background: var(--surface); border-radius: 999px; cursor: pointer; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; padding: 5px 8px 5px 10px; margin-top: 2px; }
.jar-full:hover { color: var(--fg); }
.jar-full svg.i { width: 15px; height: 15px; color: var(--faint); }

/* sealed-jar sheet */
.sheet-scrim { position: fixed; inset: 0; z-index: 30; background: rgba(12, 18, 28, .38); animation: fade .25s ease-out; }
.sheet { position: fixed; z-index: 31; left: 50%; bottom: 0; transform: translateX(-50%); width: min(420px, 100%); max-height: 88%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); border-radius: 26px 26px 0 0; box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); animation: rise .3s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { transform: translate(-50%, 40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.sheet .grip { width: 36px; height: 4px; border-radius: 4px; background: var(--line); margin: 10px auto 0; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px max(20px, env(safe-area-inset-right, 0px)) 6px max(20px, env(safe-area-inset-left, 0px)); }
.sheet-head h2 { flex: 1; margin: 0; font-family: var(--display); font-weight: 500; font-size: 19px; letter-spacing: .04em; }
.sheet-body { overflow-y: auto; padding: 4px max(20px, env(safe-area-inset-right, 0px)) 28px max(20px, env(safe-area-inset-left, 0px)); }
.sheet .lead { margin: 0 0 18px; font-size: 13px; color: var(--muted); }
.stats { background: var(--sunk); border-radius: 20px; padding: 14px 10px 12px; margin: 4px 0 20px; }
.stats-total { font-family: var(--display); font-size: 26px; font-weight: 500; line-height: 1.2; margin: 0 0 12px 8px; font-variant-numeric: tabular-nums; }
.stats-total small { font-family: var(--body); font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.jar-detail .stats { margin-top: 12px; }

/* jar-full moment */
.cere-scrim { position: fixed; inset: 0; z-index: 40; background: rgba(12, 18, 28, .5); animation: fade .3s ease-out; }
.cere { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(380px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto; box-sizing: border-box; background: var(--surface); border-radius: 28px; padding: 20px 22px 22px; text-align: center; box-shadow: var(--shadow); animation: pop .4s cubic-bezier(.2, .8, .2, 1); }
@keyframes pop { from { transform: translate(-50%, -46%) scale(.96); opacity: 0; } }
#cere-jar { width: 100%; height: 170px; display: block; }
.cere h2 { font-family: var(--display); font-weight: 600; font-size: 24px; letter-spacing: .06em; margin: 8px 0 2px; }
.cere-sub { margin: 0; font-size: 13px; color: var(--muted); }
.cere-h { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .08em; margin: 22px 0 8px; text-align: left; }
.cere .stats { margin: 0; }
.pick { background: var(--accent-soft); border-radius: 18px; padding: 14px 16px; text-align: left; }
.pick.loading { color: var(--muted); font-size: 14px; animation: pulse 1.4s ease-in-out infinite; }
.pick-top { display: flex; gap: 10px; align-items: center; }
.pick-top .tic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.pick-top .tic svg.i { width: 16px; height: 16px; }
.pick-what { font-family: var(--display); font-size: 18px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
.pick-when { margin: 6px 0 0 40px; font-size: 12px; color: var(--muted); }
.pick-why { margin: 4px 0 0 40px; font-size: 14px; color: var(--fg); line-height: 1.55; }
.cere-acts { display: flex; justify-content: center; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
.foot button { border: 0; background: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 4px 2px; }

.shelf-grid { display: flex; flex-direction: column; gap: 22px; }
.shelf-row { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.shelf-row::after { content: ""; position: absolute; left: 0; right: 0; top: 118px; height: 3px; border-radius: 2px; background: var(--line); }
.slot { border: 0; background: none; cursor: pointer; padding: 0; display: flex; flex-direction: column; align-items: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; border-radius: 12px; }
.slot canvas { width: 100%; height: 118px; display: block; margin-bottom: 3px; }
.slot b { font-family: var(--display); font-weight: 500; font-size: 14px; color: var(--fg); margin-top: 10px; }
.slot:hover canvas { transform: translateY(-2px); transition: transform .2s; }

.jar-detail canvas { width: 100%; height: 190px; display: block; }
.jar-detail .meta { text-align: center; font-size: 13px; color: var(--muted); margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
.month { margin-top: 22px; }
.month h3 { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .08em; margin: 0 0 4px; }
.month ul { list-style: none; margin: 0; padding: 0; }
.month li { display: flex; gap: 10px; align-items: center; padding: 6px 0; overflow-wrap: anywhere; }
.month li .d { margin-left: auto; font-size: 12px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
#jar-canvas { display: block; width: 100%; height: 160px; margin: 6px 0 12px; }
.shelf { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.shelf span { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.shelf .tic { width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; }
.shelf .tic svg.i { width: 17px; height: 17px; }
.shelf b { font-weight: 500; font-size: 14px; color: var(--fg); font-variant-numeric: tabular-nums; line-height: 1.2; }
.milestone { font-size: 13px; color: var(--accent); margin: 10px 0 0; display: flex; align-items: center; gap: 6px; }
.milestone svg.i { width: 16px; height: 16px; }
.flip { margin-top: 12px; background: var(--surface); border-radius: 16px; padding: 10px 6px 10px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.flip p { margin: 0; min-width: 0; font-size: 14px; overflow-wrap: anywhere; line-height: 1.5; }
.flip p em { font-style: normal; color: var(--muted); font-size: 12px; display: block; }

button.tic { border: 0; padding: 0; cursor: pointer; }
button.tic:hover { filter: brightness(.95); }
.tic.pending { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.day li.retag { display: flex; gap: 6px; flex-wrap: wrap; padding: 2px 0 10px 38px; }
.retag button { border: 0; background: var(--sunk); border-radius: 999px; padding: 4px 10px 4px 6px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--muted); }
.retag button[aria-pressed="true"] { color: var(--fg); box-shadow: 0 0 0 1.5px var(--fg); }
.retag svg.i { width: 15px; height: 15px; }

.day { margin-top: 20px; }
.day h3 { font-size: 12px; font-weight: 500; color: var(--muted); margin: 0 0 6px; letter-spacing: .06em; }
.day ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
.day li { padding: 6px 0; overflow-wrap: anywhere; display: flex; gap: 10px; align-items: center; }
.day .tic, .month .tic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.day .tic svg.i, .month .tic svg.i { width: 15px; height: 15px; }
.more { margin-top: 14px; border: 0; background: none; color: var(--muted); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.more svg.i { width: 16px; height: 16px; }

.foot { font-size: 12px; color: var(--faint); text-align: center; }
@media (prefers-reduced-motion: reduce) { .note, body, .bar .pill, .toast { transition: none; } .sheet, .sheet-scrim, .cere, .cere-scrim, .pick.loading { animation: none; } .tic.pending { animation: none; opacity: .5; } }
</style>

<script>

      [78, 16, "学了一道新菜", "home"], [80, 14, "第一次去陶艺店看了看", "hand"], [81, 10, "早起", "body"],
      [82, 22, "写了日记", "mind"], [84, 13, "晒了被子", "home"], [85, 18, "和朋友散步聊天", "people"],
      [86, 10, "跑步", "body"], [88, 15, "画了速写", "hand"]
    ];
    return {
      dumps: [
        { id: 1, text: "那个对话的回放又来了。写下来，先不想。", t: n - 40 * 60000 },
        { id: 2, text: "想再去陶艺店，这次报个四节的课", t: n - 3 * 3600000 },
        { id: 3, text: "冰箱里的菠菜要吃掉", t: n - 5 * 3600000 },

        { id: 6, text: "学日语？", t: n - 6 * DAY }
      ],
      one: { text: "去河边走一圈", day: dayKey(n), t: n },
      done: raw.map(function (r, i) { return { id: 1000 + i, text: r[2], tag: r[3], t: Math.min(n - 60000, t0 - r[0] * DAY + r[1] * 3600000) }; }),

  }

  var s;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) { s = null; }

  function save() { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  var editingId = null, showDays = 5, dropAnim = null;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SVGNS = "http://www.w3.org/2000/svg";

  function icon(id) {
    var svg = document.createElementNS(SVGNS, "svg"); svg.setAttribute("class", "i");
    var use = document.createElementNS(SVGNS, "use"); use.setAttribute("href", "#" + id);
    svg.appendChild(use); return svg;
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function tagIcon(tag) {
    var t = el("span", "tic"); var c = color(tag);
    t.style.background = tint(c, .22); t.style.color = c;
    t.appendChild(icon("t-" + (tag || "none"))); return t;
  }
  function relDay(t) {
    var diff = Math.round((startOfToday() - new Date(t).setHours(0, 0, 0, 0)) / DAY);
    if (diff <= 0) return "今天";
    if (diff === 1) return "昨天";
    var d = new Date(t), w = "日一二三四五六"[d.getDay()];
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 · 周" + w;
  }

  function addDone(text) {
    var before = s.done.length;
    var item = { id: s.next++, text: text, tag: null, auto: true, pending: true, t: Date.now() };
    s.done.push(item);
    if (!reduce) dropAnim = { start: performance.now() };
    if (Math.floor(s.done.length / 50) > Math.floor(before / 50)) s.milestone = s.done.length;
    classify(item.id, text);
    if (s.done.length % CAP === 0) {
      var n = s.done.length / CAP - 1;
      setTimeout(function () { celebrate(n); }, reduce ? 0 : 900); // let the last pebble land first
    }
  }

  /* ---------- auto tagging ---------- */
  // Asks Claude through the page's `sample` capability; falls back to keywords when that isn't available.
  var samplerP = null;
  function sampler() {
    if (!samplerP) samplerP = (window.claude && window.claude.use) ? window.claude.use("sample").catch(function () { return null; }) : Promise.resolve(null);
    return samplerP;
  }
  var KEYWORDS = {
    body: /走|跑|游泳|骑|爬山|瑜伽|拉伸|运动|健身|睡|早起|太阳|体检|医|药|散步/,
    people: /妈|爸|姐|哥|弟|妹|朋友|家人|邻居|同事|电话|视频|聊|吃饭|见面|读书会|寄|回了消息/,
    hand: /画|速写|水彩|陶|捏|缝|织|木|面包|吉他|琴|拼图|手工|做了一个/,
    home: /整理|收拾|打扫|扫除|洗|床单|衣柜|冰箱|浇花|做饭|炒|汤|饺子|菜|晒被|修/,
    mind: /读|书|写|日记|冥想|电影|展|图书馆|想法|学/
  };
  function guess(text) {
    for (var k in KEYWORDS) if (KEYWORDS[k].test(text)) return k;
    return null;
  }
  function classify(id, text) {
    sampler().then(function (sample) {
      if (!sample) return guess(text);
      return sample.json(
        "把一件已经做完的小事归到一个类别。只回 JSON：{\"tag\":\"<类别>\"}。\n" +
        "类别：body（身体：运动、散步、睡眠、晒太阳、看病）、people（人：联系、见面、陪伴、帮忙）、" +
        "hand（手艺：画画、手工、乐器、烘焙、学一门手上的技能）、home（家：家务、整理、做饭、采购、修东西）、" +
        "mind（心：阅读、写作、冥想、看展看电影、独处）。都不合适就用 none。\n事情：" + text,
        { modelTier: "quick" }
      ).then(function (r) {
        var t = r && r.tag;
        return TAGS.some(function (x) { return x.k === t; }) ? t : null;
      }, function () { return guess(text); });
    }).then(function (tag) {
      var item = s.done.find(function (d) { return d.id === id; });
      if (!item || !item.pending) return; // removed, or changed by hand meanwhile
      item.tag = tag; item.pending = false;
      save(); render();
    });
  }
  function retag(id, tag) {
    var item = s.done.find(function (d) { return d.id === id; });
    if (!item) return;
    item.tag = tag; item.auto = false; item.pending = false;
    editingId = null; save(); render();
  }

  /* ---------- jar ---------- */
  function rand(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

    var sorted = s.done.slice().sort(function (a, b) { return a.t - b.t; });

    return { full: full, cur: sorted.slice(full * CAP) };
  }
  function chunks() {
    var sorted = s.done.slice().sort(function (a, b) { return a.t - b.t; }), out = [];

    return out;
  }

  }
  // Paints one jar of pebbles on a canvas; returns false while the drop animation is still running.
  function paintJar(c, cur, full, animate, sealed, lidP) {

      x += (rand(i + full * CAP) - 0.5) * 2.2;
      var y = jy + jh - pr - 3 - row * rowH + (rand(i * 3 + 7) - 0.5) * 1.6;
      if (animate && dropAnim && i === cur.length - 1) {
        var p = Math.min(1, (now - dropAnim.start) / 560);
        if (p < 1) animDone = false;
        var ease = 1 - Math.pow(1 - p, 3);
        y = (jy - 12) + (y - (jy - 12)) * ease;
      }
      var rx = pr * (0.9 + rand(i * 5) * 0.12), ry = pr * (0.78 + rand(i * 7) * 0.1), rot = rand(i * 11) * Math.PI;
      g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fillStyle = color(d.tag); g.fill();
      g.beginPath(); g.ellipse(x - rx * 0.3, y - ry * 0.35, rx * 0.35, ry * 0.22, -0.4, 0, Math.PI * 2); g.fillStyle = hi; g.fill();
    });

    jarPath(); g.strokeStyle = css("--faint"); g.lineWidth = 1.25; g.stroke();
    g.beginPath(); g.moveTo(nx - 4, jy - 6); g.lineTo(nx + neck + 4, jy - 6);
    g.lineCap = "round"; g.lineWidth = 3; g.stroke();
    if (sealed) { // a lid on top; lidP (0..1) lowers it into place
      var e = lidP == null ? 1 : 1 - Math.pow(1 - lidP, 3), ly = jy - 14 - (1 - e) * 28;
      g.globalAlpha = e;
      g.beginPath();
      if (g.roundRect) g.roundRect(nx - 5, ly, neck + 10, 10, 4); else g.rect(nx - 5, ly, neck + 10, 10);
      g.fillStyle = tint(css("--accent"), .5); g.fill();
      g.globalAlpha = 1;
    }

    return animDone;
  }

  /* ---------- jar-full moment ---------- */
  function dayStart(t) { var d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function celebrate(i) {
    var jar = chunks()[i];
    if (!jar || jar.length < CAP) return;
    var first = jar[0].t, last = jar[jar.length - 1].t;
    var days = Math.round((dayStart(last) - dayStart(first)) / DAY) + 1;
    $("cere-title").textContent = "第 " + (i + 1) + " 罐装满了";
    $("cere-sub").textContent = cnDate(first) + " – " + cnDate(last) + "，" + days + " 天里攒下的 " + jar.length + " 件事";
    var st = $("cere-stats"); st.textContent = "";
    var w = el("div", "stats"); w.appendChild(statsRow(jar, true)); st.appendChild(w);
    $("cere").hidden = false; $("cere-scrim").hidden = false;
    var start = performance.now();

      var p = reduce ? 1 : Math.max(0, Math.min(1, (performance.now() - start - 300) / 700));
      paintJar($("cere-jar"), jar, i * CAP, false, true, p);
      if (p < 1 && !$("cere").hidden) requestAnimationFrame(frame);
    })();
    renderPick(i, jar);
    $("cere-done").focus();
  }
  function closeCere() { $("cere").hidden = true; $("cere-scrim").hidden = true; render(); }
  function showPick(box, jar, note) {
    var item = jar.find(function (d) { return d.id === note.id; }) || jar[0];
    box.className = "pick"; box.textContent = "";
    var top = el("div", "pick-top"); top.appendChild(tagIcon(item.tag));
    top.appendChild(el("span", "pick-what", item.text)); box.appendChild(top);
    box.appendChild(el("p", "pick-when", cnDate(item.t)));
    if (note.why) box.appendChild(el("p", "pick-why", note.why));
  }
  function renderPick(i, jar) {
    var box = $("cere-pick"), note = s.jarNotes && s.jarNotes[i];
    if (note) { showPick(box, jar, note); return; }
    box.className = "pick loading"; box.textContent = "正在翻这一罐…";
    pickInteresting(jar).then(function (n) {
      s.jarNotes = s.jarNotes || {}; s.jarNotes[i] = n; save();
      showPick(box, jar, n);
    });
  }
  // Claude picks the most interesting item; without it, prefer "first time / finally worked" moments.
  function fallbackPick(jar) {
    var hit = jar.filter(function (d) { return /第一次|第二次|成了|学会|终于/.test(d.text); });
    if (hit.length) return { id: hit[hit.length - 1].id, why: "以前没做过，或者试了不止一次的事。" };
    var counts = {};
    jar.forEach(function (d) { counts[d.tag] = (counts[d.tag] || 0) + 1; });
    var rare = jar.slice().sort(function (a, b) { return (counts[a.tag] - counts[b.tag]) || (b.text.length - a.text.length); })[0];
    return { id: rare.id, why: "这一罐里不太常出现的一类事。" };
  }
  function pickInteresting(jar) {
    return sampler().then(function (sample) {
      if (!sample) return fallbackPick(jar);
      var lines = jar.map(function (d, k) { return k + ". " + md(d.t) + " " + d.text; }).join("\n");
      return sample.json(
        "下面是一个人在一段时间里做过的 " + jar.length + " 件小事，按时间排列，每行“编号. 日期 事情”。\n" +
        "挑出最有意思的一件：比如第一次尝试、失败后又试一次、意外或温暖的时刻。不要挑最有成就感的，也不要评价其他事。\n" +
        "只回 JSON：{\"index\": 编号, \"why\": \"一句话说为什么，温和具体，不超过 30 个字，不用感叹号，用“你”称呼\"}\n\n" + lines,
        { modelTier: "default" }
      ).then(function (r) {
        var k = r && Number(r.index);
        if (!(k >= 0 && k < jar.length)) return fallbackPick(jar);
        return { id: jar[k].id, why: String(r.why || "").slice(0, 60) };
      }, function () { return fallbackPick(jar); });
    });
  }

  /* ---------- sealed jars ---------- */
  // A bottom sheet: a shelf of sealed jars; tap one to see what's inside.
  var sheetJar = null;
  function md(t) { var d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate(); }
  function cnDate(t) { var d = new Date(t); return (d.getMonth() + 1) + "月" + d.getDate() + "日"; }
  function openSheet() {
    sheetJar = null;
    $("sheet").hidden = false; $("sheet-scrim").hidden = false;
    renderSheet(); $("sheet-close").focus();
  }
  function closeSheet() {
    $("sheet").hidden = true; $("sheet-scrim").hidden = true;
    $("jar-full").focus();
  }
  // One row of the five categories; with counts=true each shows how many of `items` it holds.
  function statsRow(items, counts) {
    var sh = el("div", "shelf");
    TAGS.forEach(function (t) {
      var sp = el("span"); sp.appendChild(tagIcon(t.k));
      if (counts) sp.appendChild(el("b", null, items.filter(function (d) { return d.tag === t.k; }).length));
      sp.appendChild(document.createTextNode(t.n)); sh.appendChild(sp);
    });
    return sh;
  }
  function renderSheet() {
    var body = $("sheet-body"), full = currentJar().full, all = chunks(), paint = [];
    body.textContent = ""; body.scrollTop = 0;
    $("sheet-back").hidden = sheetJar == null;
    if (sheetJar == null) {
      $("sheet-title").textContent = "罐子架";
      var stats = el("div", "stats");
      var tot = el("p", "stats-total"); tot.appendChild(document.createTextNode(s.done.length));
      tot.appendChild(el("small", null, "件，到现在一共攒下的")); stats.appendChild(tot);
      stats.appendChild(statsRow(s.done, true));
      body.appendChild(stats);
      body.appendChild(el("p", "lead", full ? "每罐 60 件，满了就盖上盖子放到这里。" : "还没有装满的罐子。满 60 件会盖上盖子放到这里。"));
      var grid = el("div", "shelf-grid");
      for (var i = 0; i < full; i++) (function (i) {
        var jar = all[i];
        var b = el("button", "slot");
        b.setAttribute("aria-label", "第 " + (i + 1) + " 罐，" + cnDate(jar[0].t) + "到" + cnDate(jar[jar.length - 1].t) + "，点开看里面");
        var cv = el("canvas"); b.appendChild(cv); paint.push([cv, jar, i, 1]);
        b.appendChild(el("b", null, "第 " + (i + 1) + " 罐"));
        b.appendChild(el("span", null, md(jar[0].t) + " – " + md(jar[jar.length - 1].t)));
        b.addEventListener("click", function () { sheetJar = i; renderSheet(); });
        if (i % 3 === 0) grid.appendChild(el("div", "shelf-row")); // one plank per row of three
        grid.lastChild.appendChild(b);
      })(i);
      body.appendChild(grid);
    } else {
      var jar = all[sheetJar];
      $("sheet-title").textContent = "第 " + (sheetJar + 1) + " 罐";
      var wrap = el("div", "jar-detail");
      var cv = el("canvas"); wrap.appendChild(cv); paint.push([cv, jar, sheetJar, 1]);
      wrap.appendChild(el("p", "meta", cnDate(jar[0].t) + " – " + cnDate(jar[jar.length - 1].t) + " · " + jar.length + " 件"));
      var js = el("div", "stats"); js.appendChild(statsRow(jar, true)); wrap.appendChild(js);
      var note = s.jarNotes && s.jarNotes[sheetJar];
      if (note) {
        wrap.appendChild(el("h3", "cere-h", "这一罐里最有意思的一件"));
        var pk = el("div"); showPick(pk, jar, note); wrap.appendChild(pk);
      }
      body.appendChild(wrap);
      var months = [], byKey = {};
      jar.slice().reverse().forEach(function (d) {
        var dt = new Date(d.t), k = dt.getFullYear() + "-" + dt.getMonth();
        if (!byKey[k]) { byKey[k] = { label: (dt.getFullYear() !== new Date().getFullYear() ? dt.getFullYear() + " 年 " : "") + (dt.getMonth() + 1) + " 月", items: [] }; months.push(byKey[k]); }
        byKey[k].items.push(d);
      });
      months.forEach(function (m) {
        var sec = el("div", "month"); sec.appendChild(el("h3", null, m.label));
        var ul = el("ul");
        m.items.forEach(function (d) {
          var li = el("li"); li.appendChild(tagIcon(d.tag)); li.appendChild(el("span", null, d.text));
          li.appendChild(el("span", "d", new Date(d.t).getDate() + " 日")); ul.appendChild(li);
        });
        sec.appendChild(ul); body.appendChild(sec);
      });
    }
    paint.forEach(function (x) { paintJar(x[0], x[1], x[2] * CAP, false, x[3]); });
  }

  function renderJar() {
    // Main view shows no counts: the pebble colors carry the picture, numbers live in the jar shelf sheet.
    var full = currentJar().full;
    var jt = $("jar-total"); jt.textContent = "";
    jt.appendChild(document.createTextNode("第 " + (full + 1) + " 罐"));
    jt.appendChild(el("small", null, "正在攒"));
    var jf = $("jar-full"); jf.textContent = ""; jf.hidden = false;
    for (var i = 0; i < Math.min(full, 6); i++) jf.appendChild(icon("i-jar"));
    jf.appendChild(document.createTextNode(full ? "装满过 " + full + " 罐" : "罐子架"));
    jf.appendChild(icon("i-right"));

    var sh = $("shelf"); sh.replaceWith(statsRow(s.done, false)); sh = document.querySelector(".jar .shelf"); sh.id = "shelf";
    var m = $("milestone"); m.textContent = "";
    m.hidden = !s.milestone;
    if (s.milestone) { m.appendChild(icon("i-sparkle")); m.appendChild(document.createTextNode("第 " + s.milestone + " 件了。")); }
    drawJar();
    if (!$("sheet").hidden) renderSheet();
  }

  /* ---------- dump / one ---------- */
  var toastTimer = null, toastTab = null;
  // tab: which view "去看看" opens (null hides the button); ic: icon symbol id
  function toast(msg, tab, ic) {
    var t = $("toast");
    $("toast-text").textContent = msg;
    $("toast-icon").setAttribute("href", "#" + (ic || "i-sun"));
    toastTab = tab || null;
    $("toast-go").hidden = !toastTab;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3600);
  }
  // Pick today's one thing. If one was already picked today, it goes back to the dump list instead of vanishing.
  function setOne(text) {
    var today = dayKey(Date.now());
    var prev = s.one && s.one.day === today && !s.one.done ? s.one.text : null;
    if (prev) s.dumps.push({ id: s.next++, text: prev, t: Date.now() });
    s.one = { text: text, day: today, t: Date.now() };
    save();
    toast(prev ? "今天就它了。「" + prev + "」放回念头里了" : "今天就它了", "one", "i-sun");
  }
  function when(t) {
    var mins = Math.round((Date.now() - t) / 60000);
    if (mins < 60) return "刚才";
    if (dayKey(t) === dayKey(Date.now())) return "今天";
    return relDay(t);
  }
  function noteItem(d) {
    var li = el("li", "note");
    li.appendChild(el("p", null, d.text));
    var meta = el("div", "meta"); meta.appendChild(el("span", "when", when(d.t)));
    var acts = el("div", "acts");
    [["i-check", "做了，放进罐子", function () { addDone(d.text, null); drop(d, li); }],
     ["i-sun", "今天就它", function () { setOne(d.text); drop(d, li); }],
     ["i-wind", "放下", function () { drop(d, li); }]].forEach(function (a) {
      var b = el("button", "act"); b.setAttribute("aria-label", a[1]); b.title = a[1];
      b.appendChild(icon(a[0])); b.addEventListener("click", a[2]); acts.appendChild(b);
    });
    meta.appendChild(acts); li.appendChild(meta);
    return li;
  }
  function drop(d, li) {
    li.classList.add("gone");
    s.dumps = s.dumps.filter(function (x) { return x.id !== d.id; });
    save(); setTimeout(render, reduce ? 0 : 350);
  }

  function render() {
    var now = Date.now(), cutoff = now - 3 * DAY;
    // Yesterday's pick that wasn't done goes back to the thoughts; a done one just clears.
    if (s.one && s.one.day !== dayKey(now)) {
      if (!s.one.done) s.dumps.push({ id: s.next++, text: s.one.text, t: s.one.t || now });
      s.one = null;
    }
    var fresh = s.dumps.filter(function (d) { return d.t >= cutoff; }).sort(function (a, b) { return b.t - a.t; });
    var old = s.dumps.filter(function (d) { return d.t < cutoff; }).sort(function (a, b) { return b.t - a.t; });
    var L = $("dump-list"); L.textContent = "";
    if (!fresh.length) { var e = el("li", "empty"); e.appendChild(icon("i-leaf")); e.appendChild(document.createTextNode("这里现在是空的。")); L.appendChild(e); }
    fresh.forEach(function (d) { L.appendChild(noteItem(d)); });
    var O = $("older-list"); O.textContent = "";
    old.forEach(function (d) { O.appendChild(noteItem(d)); });
    $("older-wrap").hidden = !old.length;

    $("one-badge").hidden = !s.one || !!s.one.done;
    var box = $("one-box"); box.textContent = "";
    if (s.one && s.one.done) {
      var cd = el("div", "one done");
      var labd = el("div", "label"); labd.appendChild(icon("i-check")); labd.appendChild(document.createTextNode("今天这件做完了"));
      cd.appendChild(labd);
      cd.appendChild(el("div", "what", s.one.text));
      var ad = el("div", "acts");
      var again = el("button", "btn quiet"); again.appendChild(icon("i-plus")); again.appendChild(document.createTextNode("再选一件"));
      again.addEventListener("click", function () { s.one = null; save(); render(); });
      var see = el("button", "btn quiet"); see.appendChild(icon("i-jar")); see.appendChild(document.createTextNode("看看罐子"));
      see.addEventListener("click", function () { goTab("done"); });
      ad.appendChild(see); ad.appendChild(again); cd.appendChild(ad); box.appendChild(cd);
      box.appendChild(el("p", "hint sub-hint", "已经放进罐子里了。今天到这里就很好。"));
    } else if (s.one) {
      var c = el("div", "one");
      var lab = el("div", "label"); lab.appendChild(icon("i-sun")); lab.appendChild(document.createTextNode("今天想做的一件事"));
      c.appendChild(lab);
      c.appendChild(el("div", "what", s.one.text));
      var a = el("div", "acts");
      var ok = el("button", "btn"); ok.appendChild(icon("i-check")); ok.appendChild(document.createTextNode("做了，放进罐子"));
      ok.addEventListener("click", function () {
        addDone(s.one.text, null); s.one.done = true; save(); render();
        toast("放进罐子了", "done", "i-jar");
      });
      var no = el("button", "btn quiet"); no.appendChild(icon("i-left")); no.appendChild(document.createTextNode("今天不做了"));
      no.addEventListener("click", function () {
        s.dumps.push({ id: s.next++, text: s.one.text, t: Date.now() }); s.one = null; save(); render();
        toast("放回念头里了，哪天想做再挑", "dump", "i-left");
      });
      // 放下: gone for good, same as 放下 on a thought; no record anywhere
      var away = el("button", "btn quiet"); away.appendChild(icon("i-wind")); away.appendChild(document.createTextNode("放下"));
      away.addEventListener("click", function () { s.one = null; save(); render(); toast("放下了", null, "i-wind"); });
      a.appendChild(ok); a.appendChild(no); a.appendChild(away); c.appendChild(a); box.appendChild(c);
      box.appendChild(el("p", "hint sub-hint", "「今天不做了」会放回念头里；「放下」就彻底不要了。都不点的话，明天它会回到念头里。"));
    } else {
      var em = el("p", "empty"); em.appendChild(icon("i-leaf")); em.appendChild(document.createTextNode("今天没有选。这也完全可以。"));
      box.appendChild(em);
      var f = el("div", "composer");
      var i = el("input"); i.type = "text"; i.id = "one-in"; i.placeholder = "想选一件的话，写在这里";
      var gbtn = el("button", "send"); gbtn.setAttribute("aria-label", "就它"); gbtn.appendChild(icon("i-check"));
      gbtn.addEventListener("click", function () { var v = i.value.trim(); if (!v) return; setOne(v); render(); });
      i.addEventListener("keydown", function (e) { if (e.key === "Enter") gbtn.click(); });
      f.appendChild(i); f.appendChild(gbtn); box.appendChild(f);
      box.appendChild(el("p", "hint sub-hint", "也可以从「倒出来」里点太阳图标挑一件。"));
    }

    var D = $("done-list"); D.textContent = "";
    var groups = [], map = {};
    s.done.slice().sort(function (a, b) { return b.t - a.t; }).forEach(function (d) {
      var k = dayKey(d.t);
      if (!map[k]) { map[k] = { t: d.t, items: [] }; groups.push(map[k]); }
      map[k].items.push(d);
    });
    if (!groups.length) D.appendChild(el("p", "empty", "罐子还是空的。做了什么小事都可以放进来。"));
    groups.slice(0, showDays).forEach(function (g) {
      var sec = el("div", "day"); sec.appendChild(el("h3", null, relDay(g.t)));
      var ul = el("ul");
      g.items.forEach(function (d) {
        var li = el("li");
        var tb = el("button", "tic"); var c = color(d.tag);
        tb.style.background = tint(c, .22); tb.style.color = c;
        tb.appendChild(icon("t-" + (d.tag || "none")));
        if (d.pending) tb.classList.add("pending");
        var name = (TAGS.find(function (x) { return x.k === d.tag; }) || { n: "未分类" }).n;
        tb.setAttribute("aria-label", (d.pending ? "正在分类" : "分类：" + name) + "，点一下修改");
        tb.title = d.pending ? "正在分类…" : name + (d.auto ? "（自动）" : "");
        tb.setAttribute("aria-expanded", editingId === d.id ? "true" : "false");
        tb.addEventListener("click", function () { editingId = editingId === d.id ? null : d.id; render(); });
        li.appendChild(tb); li.appendChild(el("span", null, d.text)); ul.appendChild(li);
        if (editingId === d.id) {
          var row = el("li", "retag");
          TAGS.concat([{ k: null, n: "不分类" }]).forEach(function (t) {
            var b = el("button"); b.setAttribute("aria-pressed", d.tag === t.k ? "true" : "false");
            var ic = icon("t-" + (t.k || "none")); ic.style.color = color(t.k);
            b.appendChild(ic); b.appendChild(document.createTextNode(t.n));
            b.addEventListener("click", function () { retag(d.id, t.k); });
            row.appendChild(b);
          });
          ul.appendChild(row);
        }
      });
      sec.appendChild(ul); D.appendChild(sec);
    });
    $("more").hidden = groups.length <= showDays;

    renderJar();
    save();
  }

  /* ---------- controls ---------- */
  $("dump-go").addEventListener("click", function () {
    var v = $("dump-in").value.trim(); if (!v) return;
    s.dumps.push({ id: s.next++, text: v, t: Date.now() }); $("dump-in").value = ""; render();
  });
  $("dump-in").addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("dump-go").click(); });
  $("done-go").addEventListener("click", function () {
    var v = $("done-in").value.trim(); if (!v) return;
    addDone(v); $("done-in").value = ""; render();
  });
  $("done-in").addEventListener("keydown", function (e) { if (e.key === "Enter") $("done-go").click(); });
  $("more").addEventListener("click", function () { showDays += 7; render(); });
  $("jar-full").addEventListener("click", openSheet);
  $("sheet-close").addEventListener("click", closeSheet);
  $("sheet-scrim").addEventListener("click", closeSheet);
  $("sheet-back").addEventListener("click", function () { sheetJar = null; renderSheet(); $("sheet-close").focus(); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!$("cere").hidden) closeCere(); else if (!$("sheet").hidden) closeSheet();
  });
  $("cere-done").addEventListener("click", closeCere);
  $("cere-shelf").addEventListener("click", function () { closeCere(); openSheet(); });
  $("preview-cere").addEventListener("click", function () { if (currentJar().full) celebrate(0); });
  $("flip-go").addEventListener("click", function () {
    if (!s.done.length) return;
    var d = s.done[Math.floor(Math.random() * s.done.length)];
    var p = $("flip-text"); p.textContent = "";
    p.appendChild(el("em", null, relDay(d.t)));
    p.appendChild(document.createTextNode(d.text));
  });
  $("reset").addEventListener("click", function () { s = seed(); showDays = 5; render(); });

  function goTab(v) {
    document.querySelectorAll(".bar button").forEach(function (x) { x.setAttribute("aria-selected", x.dataset.v === v ? "true" : "false"); });
    ["dump", "one", "done"].forEach(function (k) { $("v-" + k).hidden = k !== v; });
    if (v === "done") drawJar();
  }
  document.querySelectorAll(".bar button").forEach(function (b) {
    b.addEventListener("click", function () { goTab(b.dataset.v); });
  });
  $("toast-go").addEventListener("click", function () {
    $("toast").classList.remove("show");
    if (toastTab === "done" && !reduce) dropAnim = { start: performance.now() };
    if (toastTab) goTab(toastTab);
  });
  window.addEventListener("resize", drawJar);
  function retheme() { render(); }
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", retheme);
  }
  new MutationObserver(function (list) {
    if (list.some(function (m) { return m.attributeName === "data-theme"; })) retheme();
  }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  var h = new Date().getHours();
  $("greet").textContent = h < 5 ? "这么晚还在转？" : h < 11 ? "早上好" : h < 18 ? "下午好" : "晚上好";
  render();
})();
</script>

</body>
</html>
