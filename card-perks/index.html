<style>
/* Layout: one narrow column (max 640px) styled like a card statement — ledger rows, mono figures, a bottom tab bar for thumbs. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --sunk: #e3e8ee;
  --fg: #16202b;
  --muted: #5b6878;
  --line: #d3dae3;
  --accent: #2443b8;
  --accent-soft: #dfe5fb;
  --brass: #946a12;
  --good: #1d7a4c;
  --good-soft: #dcf1e5;
  --warn: #a35a00;
  --warn-soft: #fbead2;
  --bad: #b3261e;
  --bad-soft: #f8dedb;
  --c-aa: #4a6478;
  --c-mar: #9a3f2c;
  --c-hh: #1f4b95;
  --c-ihg: #2e7353;
  --c-fr: #3a77d6;
  --c-dis: #c2570c;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #171e27; --sunk: #1f2833; --fg: #e6ebf1; --muted: #93a0b0; --line: #2b3542;
    --accent: #8ea4ff; --accent-soft: #24305a; --brass: #d9ae50;
    --good: #5fcf94; --good-soft: #153826; --warn: #f0a650; --warn-soft: #3d2a12; --bad: #ff8a80; --bad-soft: #43201d;
    --c-aa: #8fb0c8; --c-mar: #e08a72; --c-hh: #7fa6ef; --c-ihg: #6fc79c; --c-fr: #7fb0ff; --c-dis: #f39a55;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #171e27; --sunk: #1f2833; --fg: #e6ebf1; --muted: #93a0b0; --line: #2b3542;
  --accent: #8ea4ff; --accent-soft: #24305a; --brass: #d9ae50;
  --good: #5fcf94; --good-soft: #153826; --warn: #f0a650; --warn-soft: #3d2a12; --bad: #ff8a80; --bad-soft: #43201d;
  --c-aa: #8fb0c8; --c-mar: #e08a72; --c-hh: #7fa6ef; --c-ihg: #6fc79c; --c-fr: #7fb0ff; --c-dis: #f39a55;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
select { width: 100%; }
.row > *, .field > * { min-width: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(84px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 750 26px/1.1 var(--f-display); margin: 0; letter-spacing: -0.01em; }
h2 { font: 600 18px/1.25 var(--f-display); margin: 0; text-wrap: balance; }
h3 { font: 600 15px/1.3 var(--f-body); margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
section { display: grid; gap: 10px; }
.view { display: grid; gap: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.rows > * + * { border-top: 1px solid var(--line); }
.row { padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.row-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; min-width: 0; }
.row-head > :first-child { min-width: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.cardtag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.note { font-size: 13px; color: var(--muted); }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.good > i { background: var(--good); }
button, .btn { font: 600 14px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 12px; border-radius: 8px; cursor: pointer; min-height: 38px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button.ghost { background: transparent; }
button.small { padding: 4px 10px; min-height: 32px; font-size: 13px; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font: 15px var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 38px; max-width: 100%; }
textarea { width: 100%; min-height: 150px; font: 13px/1.45 var(--f-mono); resize: vertical; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
/* Use tab */
.cat { padding: 12px 14px; display: grid; gap: 4px; cursor: pointer; }
.cat-main { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.cat-name { font-weight: 600; }
.pct { font: 500 17px var(--f-mono); font-variant-numeric: tabular-nums; }
.rank { display: grid; gap: 4px; padding-top: 6px; }
.rank-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 13.5px; padding: 6px 0; border-top: 1px dashed var(--line); }
.rank-row .note { grid-column: 1 / -1; font-size: 12px; }
.alert { padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.alert .stripe { width: 4px; align-self: stretch; border-radius: 2px; background: var(--warn); flex: none; }
.alert.bad .stripe { background: var(--bad); }
.alert.info .stripe { background: var(--accent); }
.alert > div:last-child { min-width: 0; display: grid; gap: 2px; }
/* Summary figures */
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.fig { padding: 12px 14px; display: grid; gap: 2px; }
.fig b { font: 500 22px var(--f-mono); font-variant-numeric: tabular-nums; }
/* Review */
.txn { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 14px; font-size: 14px; }
.txn .m { min-width: 0; overflow-wrap: anywhere; }
.txn .note { grid-column: 1 / -1; }
.catbar { display: grid; grid-template-columns: 7.5em 1fr 5.5em; gap: 8px; align-items: center; font-size: 13px; }
.catbar .bar { height: 10px; }
.status { font-size: 13px; padding: 10px 14px; border-radius: var(--r); background: var(--sunk); color: var(--muted); }
/* Bottom nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 10px 4px 12px; display: grid; gap: 2px; justify-items: center; font-size: 12.5px; min-height: 56px; }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
details summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.src a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .3s ease; } }
</style>

    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>设置</button>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Card rules. Terms checked 2026-10-29 against public reviews; items marked
// verify:true are from memory or conflicting sources — confirm with issuer.
// ---------------------------------------------------------------------------
const TERMS_CHECKED = "2026-10-29";
const D = (s) => new Date(s + "T00:00:00");
const AA_REFRESH = D("2027-01-24");
const IHG_REFRESH = D("2027-01-01");

const CARDS = {
  fr:  { name: "Chase Freedom Unlimited", short: "Freedom U", cur: "UR", fee: 0, ftf: 0.03, color: "var(--c-fr)" },
  dis: { name: "Discover it Cash Back", short: "Discover", cur: "DIS", fee: 0, ftf: 0, color: "var(--c-dis)" },
  hh:  { name: "Hilton Honors Aspire (Amex)", short: "Aspire", cur: "HH", fee: 550, ftf: 0, color: "var(--c-hh)" },
  aa:  { name: "Citi AAdvantage Platinum Select", short: "Citi AA", cur: "AA", fee: 99, ftf: 0, color: "var(--c-aa)" },
  ihg: { name: "IHG One Rewards Premier", short: "IHG Premier", cur: "IHG", fee: 99, ftf: 0, color: "var(--c-ihg)" },
  mar: { name: "Marriott Bonvoy Boundless", short: "Boundless", cur: "MAR", fee: 95, ftf: 0, color: "var(--c-mar)" },
};
const CUR_LABEL = { DIS: "Discover 返现", UR: "Chase UR", HH: "Hilton", AA: "AA miles", IHG: "IHG", MAR: "Marriott" };

const CATS = [
  ["dining", "餐厅"], ["grocery", "超市 Grocery"], ["gas", "加油 / EV 充电"], ["other", "其他一切"],
  ["flight_aa", "AA 机票"], ["flight_other", "其他航司机票"], ["car_rental", "租车"], ["transit", "打车 / 公交"],
  ["hotel_hilton", "Hilton 酒店"], ["hotel_marriott", "Marriott 酒店"], ["hotel_ihg", "IHG 酒店"], ["hotel_other", "其他酒店 / OTA"],
  ["streaming", "流媒体"], ["entertainment", "娱乐 / 演出 / 电影"], ["utilities", "水电燃气网费"], ["drugstore", "药店"], ["red_cross", "Red Cross 捐款"], ["foreign", "海外消费"],
];
const CAT_LABEL = Object.fromEntries(CATS);
const FREEDOM_Q_DEFAULT = { "2026Q4": ["grocery", "dining", "red_cross"] };
const FREEDOM_ACTIVATE_BY = { "2026Q4": "2026-12-14" };
const DISCOVER_Q_DEFAULT = { "2026Q4": ["dining", "entertainment", "utilities"] };

const DEFAULT_CONFIG = {
  freedomVariant: "unlimited",         // legacy | flex | unlimited
  discoverVariant: "cashback",         // cashback | miles | chrome
  discoverQ: {},                       // overrides { "2026Q4": [...] }
  disActivated: {},
  disMatch: false,                     // first-year Cashback Match
  last4: { mar: "", ihg: "", fr: "" },  // Chase card last 4 digits, for CSV matching
  vals: { DIS: 1.0, UR: 1.0, HH: 0.45, AA: 1.5, IHG: 0.5, MAR: 0.7 }, // cents/point, user assumptions
  anniv: { aa: 0, mar: 0, hh: 0, ihg: 0 },                   // card-open month 1-12, 0 = unset
  freedomQ: {},                        // overrides { "2026Q4": [...] }
  frActivated: {},                     // { "2026Q4": true }
  spend: { dis5: 0, disChrome: 0, mar3x: 0, fr5: 0, hhCal: 0, aaYear: 0, ihgYear: 0, marYear: 0 },
  fnValue: { hh: 400, ihg: 200, mar: 175 },                  // what one free night is worth to you, $
};

function quarterKey(d) { return d.getFullYear() + "Q" + (Math.floor(d.getMonth() / 3) + 1); }
function freedomCats(q) { return CFG.freedomQ[q] || FREEDOM_Q_DEFAULT[q] || []; }
function discoverCats(q) { return CFG.discoverQ[q] || DISCOVER_Q_DEFAULT[q] || []; }

// Returns { m: points per $, notes: [], verify }
function earn(card, cat, d, opts = {}) {
  const S = CFG, n = [];
  let m = 1, verify = false;
  if (card === "aa") {
    const after = d >= AA_REFRESH;
    if (cat === "flight_aa") m = 2;
    else if (cat === "gas") m = 2;
    else if (cat === "dining") { m = 2; verify = true; n.push(after ? "2027/1/24 改版后餐厅 2x 是否保留未确认" : "餐厅 2x（凭记忆，未从 Citi 官网核实）"); }
    else if (after && ["transit", "streaming", "car_rental"].includes(cat)) { m = 2; n.push("2027/1/24 起新增"); }
  } else if (card === "mar") {
    if (cat === "hotel_marriott") { m = 6; n.push("卡本身 6x；会员基础积分与卡无关，未计入"); }
    else if (["grocery", "gas", "dining"].includes(cat)) {
      if ((S.spend.mar3x || 0) < 6000) { m = 3; n.push(`3x 仅限每年前 $6,000（已用 $${fmt0(S.spend.mar3x)}）`); }
      else { m = 2; n.push("3x 年度额度已用完"); }
    } else m = 2;
  } else if (card === "hh") {
    if (cat === "hotel_hilton") m = 14;
    else if (cat === "flight_aa" || cat === "flight_other") { m = 7; n.push("需直接向航司或 Amex Travel 订"); }
    else if (cat === "car_rental") { m = 7; n.push("需直接向租车公司订"); }
    else if (cat === "dining") { if (opts.foreign) { m = 3; n.push("7x 仅限美国餐厅"); } else { m = 7; n.push("仅美国餐厅"); } }
    else m = 3;
  } else if (card === "ihg") {
    if (cat === "hotel_ihg") { m = 10; n.push("卡本身 10x；会员积分另算"); }
    else if (d < IHG_REFRESH) {
      if (["flight_aa", "flight_other", "car_rental", "hotel_other", "transit", "gas", "dining"].includes(cat)) { m = 5; if (["flight_aa","flight_other","car_rental","hotel_other","transit"].includes(cat)) n.push("5x 广义旅行仅到 2026/12/31"); }
      else m = 3;
    } else {
      if (["flight_aa", "flight_other", "car_rental", "gas", "grocery", "dining"].includes(cat)) { m = 5; verify = true; n.push("2027 新类别（老卡生效日待 Chase 通知）"); }
      else m = 3;
    }
  } else if (card === "dis") {
    const v = S.discoverVariant;
    if (v === "miles") m = 1.5;
    else if (v === "chrome") {
      verify = true;
      if (["gas", "dining"].includes(cat) && ((S.spend.disChrome || 0) < 1000 || opts.historical)) { m = 2; n.push("2% 加油+餐厅每季前 $1,000（凭记忆）"); }
    } else {
      const q = quarterKey(d);
      if (discoverCats(q).includes(cat)) {
        if (!S.disActivated[q]) n.push("本季 5% 类别，但你还没激活（激活前的消费不补）");
        else if ((S.spend.dis5 || 0) >= 1500 && !opts.historical) n.push("本季 $1,500 额度已用完");
        else { m = 5; n.push(`本季 5%，季度 $1,500 封顶（已用 $${fmt0(S.spend.dis5)}）`); }
      }
    }
    if (S.disMatch) { m *= 2; n.push("首年 Cashback Match ×2"); }
  } else if (card === "fr") {
    const v = S.freedomVariant;
    const base = v === "unlimited" ? 1.5 : 1;
    let catRate = base;
    if (v !== "legacy" && (cat === "dining" || cat === "drugstore")) catRate = 3;
    m = catRate;
    if (v !== "unlimited") {
      const q = quarterKey(d);
      if (freedomCats(q).includes(cat)) {
        if (!S.frActivated[q]) n.push(`本季 5% 类别，但你还没激活`);
        else if ((S.spend.fr5 || 0) >= 1500 && !opts.historical) n.push("本季 $1,500 额度已用完");
        else { m = catRate + 4; n.push(`本季 5% 类别，季度 $1,500 封顶（已用 $${fmt0(S.spend.fr5)}）`); }
      }
    }
  }
  return { m, notes: n, verify };
}

function valuePct(card, cat, d, opts = {}) {
  const e = earn(card, cat, d, opts);
  let pct = e.m * CFG.vals[CARDS[card].cur];
  if (opts.foreign && CARDS[card].ftf) { pct -= CARDS[card].ftf * 100; e.notes.push("3% 海外交易手续费"); }
  return { ...e, pct };
}
function ranking(cat, d, opts = {}) {
  let c = cat, o = { ...opts };
  if (cat === "foreign") { c = "other"; o.foreign = true; }
  return Object.keys(CARDS).map((k) => ({ card: k, ...valuePct(k, c, d, o) })).sort((a, b) => b.pct - a.pct);
}

// ---------------------------------------------------------------------------
// Benefits to track. period: quarter | half | year | cardyear | info
// ---------------------------------------------------------------------------
const BENEFITS = [
  { id: "hh_resort", card: "hh", title: "Hilton Resort 消费抵扣", amt: 200, period: "half", how: "在参与的 Hilton Resorts 直接付房费/杂费，每半年最多 $200。" },
  { id: "hh_flight", card: "hh", title: "航空消费抵扣", amt: 50, period: "quarter", how: "直接向航司或经 Amex Travel 的机票等消费，每季度最多 $50。" },
  { id: "hh_clear", card: "hh", title: "CLEAR+ 会员抵扣", amt: 219, period: "year", how: "用 Aspire 付 CLEAR+ 年费，每自然年最多 $219（金额来自第三方评测）。" },
  { id: "hh_fnr", card: "hh", title: "年度免房券 Free Night Reward", amt: 0, period: "cardyear", cert: true, fn: "hh", how: "续卡时发放；自然年消费满 $30k / $60k 各再得一张。" },
  { id: "hh_conrad", card: "hh", title: "Waldorf / Conrad $100 房内消费", period: "info", how: "用 Aspire 专属价预订 2 晚以上 Waldorf Astoria 或 Conrad 时可用。" },
  { id: "ihg_ub", card: "ihg", title: "United TravelBank Cash", amt: 50, period: "year", verify: true, how: "绑定 MileagePlus 后每年最多 $50。我记得是每半年 $25，请在 Chase 条款核对。" },
  { id: "ihg_fb", card: "ihg", title: "IHG 酒店餐饮抵扣", amt: 25, period: "quarter", verify: true, how: "2026/10 改版新增，每季度 $25（挂房账）。老卡生效日看 Chase 通知；未生效就标 N/A。" },
  { id: "ihg_fn", card: "ihg", title: "周年免房券（≤40k 分，可补分）", amt: 0, period: "cardyear", cert: true, fn: "ihg", how: "续卡后发放，可用积分补差价。改版后上限据报道升到 50k（待核实）。" },
  { id: "ihg_20k", card: "ihg", title: "$20k 消费奖励：$100 + 10k 分", amt: 0, period: "cardyear", goal: { key: "ihgYear", at: 20000 }, how: "卡年度内消费满 $20k 且续卡后发放。" },
