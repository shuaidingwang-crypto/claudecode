  if (b.period === "half") { const h = mo < 6 ? 0 : 1; return { key: y + "H" + (h + 1), end: new Date(y, h ? 12 : 6, 0), label: T`${h ? T("下") : T("上")}半年 ${y}` }; }
  if (b.period === "year") return { key: String(y), end: new Date(y, 12, 0), label: T`${y} 年` };
  if (b.period === "cardyear") {

    if (!am) return { key: "cy" + y, end: new Date(y, 12, 0), label: T`${y}（未设开卡月，按自然年）`, unset: true };

}

    Object.keys(CFG.vals).map((c) => h("label", { class: "field" }, h("span", {}, CUR_LABEL[c]), num("val-" + c, CFG.vals[c], (x) => CFG.vals[c] = x, { step: "0.05" })))),
    h("span", { class: "note" }, T("默认值：Discover 和 Chase UR（只有 Freedom U，不能转点）按 1¢ 现金；AA、Hilton、IHG、Marriott 取 The Points Guy 2026 年 10 月估值。NerdWallet 的数不同（AA 1.7、Hilton 0.35、IHG 0.5–0.6、Marriott 0.7–0.8），按你自己的兑换习惯改。")))));

  v.append(h("section", {}, h("h2", {}, T("一张免房券对你值多少（$）")), h("div", { class: "panel row" }, h("div", { class: "grid2" },
    [["hh", T("Hilton 免房券")], ["ips", T("IHG Select 免房券（≤60k）")], ["ihg", T("IHG Premier 免房券（≤40k）")], ["mar", T("Marriott 免房券")]].map(([k, l]) => h("label", { class: "field" }, h("span", {}, l), num("fn-" + k, CFG.fnValue[k], (x) => CFG.fnValue[k] = x)))),
    h("span", { class: "note" }, T("IHG 和 Marriott = 券面上限 × 每分价值（上限值，订便宜酒店就用不满）。Hilton 券不设上限，各评测估 $200–$521，取 $300。用来算“冲消费目标”的额外回报。")))));
}

// ---------------------------------------------------------------------------
function renderHeader() {
  document.documentElement.lang = LANG === "en" ? "en" : "zh-CN";
  $("#app-title").textContent = T("羊毛账本");
  document.querySelectorAll("[data-zh]").forEach((el) => { el.textContent = T(el.dataset.zh); });
  $("#today").textContent = NOW.toLocaleDateString(LANG === "en" ? "en-US" : "zh-CN", { year: "numeric", month: LANG === "en" ? "short" : "long", day: "numeric", weekday: "short" });
  document.querySelector("nav.tabs").setAttribute("aria-label", LANG === "en" ? "Main" : "主导航");
  const lb = $("#lang-btn"); lb.textContent = LANG === "en" ? "中文" : "EN"; lb.setAttribute("aria-label", LANG === "en" ? "切换到中文" : "Switch to English");
  const bar = $("#who-bar"); bar.replaceChildren(
    h("span", { class: "note" }, T("看谁的：")),
    h("div", { class: "seg", role: "radiogroup", "aria-label": T("看谁的卡") }, ["me", "spouse", "both"].map((w) =>
      h("button", { type: "button", role: "radio", "aria-checked": String(WHO === w), onclick: () => (() => { WHO = w; try { localStorage.setItem("ymzb:who", w); } catch {} renderAll(); })() }, WHO_LABEL[w]))));
}
function renderAll() { renderHeader(); renderUse(); renderPerks(); renderSettings(); renderSheet(); if (!$("#rv-text")) renderReview(); }
function showTab(t) {
  document.querySelectorAll("[data-view]").forEach((el) => { el.hidden = el.id !== "view-" + t; });
  document.querySelectorAll("nav.tabs button").forEach((b) => { if (b.dataset.tab === t) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  try { localStorage.setItem("ymzb:tab", t); } catch {}
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));
$("#lang-btn").addEventListener("click", () => {
  LANG = LANG === "en" ? "zh" : "en";
  try { localStorage.setItem("ymzb:lang", LANG); } catch {}
  defineText(); renderAll(); renderReview();
});
renderHeader();
initStore();
renderReview();
let startTab = "use"; try { startTab = localStorage.getItem("ymzb:tab") || "use"; } catch {}
showTab(["use", "perks", "review", "settings"].includes(startTab) ? startTab : "use");
</script>
